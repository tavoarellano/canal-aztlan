<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal Aztlán — Radio independiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap">
<style>
  :root{
    --paper:#EDE8DC; --ink:#1C1F1D; --ink-2:#2A2926; --ink-3:#56554E; --ink-4:#6B6A62; --ink-5:#8A887E;
    --jade:#3E7D63; --jade-d:#2F6350; --jade-dd:#24513F; --jade-l:#56926F; --jade-ll:#6BA487;
    --cochineal:#9C3B26; --line:#D6D0C1; --line-row:#E0DACB; --line-rail:#C9C2B1;
    --serif:"Cormorant Garamond",Georgia,serif; --body:"Lora",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
       min-height:100vh;padding:96px 40px 72px;display:flex;justify-content:center}
  ::selection{background:rgba(62,125,99,.18)}
  a{color:var(--jade-d);text-decoration:none} a:hover{color:var(--cochineal)}
  .wrap{width:100%;max-width:680px;display:flex;flex-direction:column;gap:64px}

  .kicker{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;
          letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--jade);animation:pulse 2.6s ease-in-out infinite}
  .rule{flex:1;height:1px;background:var(--line)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  header{display:flex;flex-direction:column;gap:22px}
  h1{margin:0;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-weight:600}
  h1 .row{display:flex;gap:5px}
  h1 .t{width:68px;height:82px;display:flex;align-items:center;justify-content:center;font-size:46px;
        color:var(--paper);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(20,50,38,.35)}
  .lead{margin:0;max-width:34ch;font-size:17px;font-weight:700;line-height:1.6;color:var(--ink-2);text-wrap:pretty}

  .player{display:flex;flex-direction:column}
  .hair-strong{height:1px;background:var(--ink)}
  .hair{height:1px;background:var(--line)}
  .player-row{display:flex;align-items:center;gap:26px;padding:26px 2px}
  .play{width:62px;height:62px;flex:none;border-radius:50%;border:1px solid var(--jade);background:transparent;
        color:var(--jade);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s ease}
  .play:hover{background:rgba(62,125,99,.1)} .play:active{background:rgba(62,125,99,.2)}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .status .label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4)}
  .status .title{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.01em}
  .vol{display:flex;align-items:center;gap:12px}
  .vol span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}
  .rail{position:relative;width:104px;height:18px;cursor:pointer;display:flex;align-items:center}
  .rail .bg{width:100%;height:1px;background:var(--line-rail)}
  .rail .fill{position:absolute;left:0;height:1px;background:var(--jade)}
  .rail .knob{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--jade);transform:translate(-50%,-50%)}

  .sched{display:flex;flex-direction:column;gap:22px}
  .sched h2{margin:0;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.24em;
            text-transform:uppercase;color:var(--ink-3)}
  .show{display:grid;grid-template-columns:78px 1fr;gap:18px;align-items:baseline;padding:18px 2px;border-top:1px solid var(--line-row)}
  .show .time{font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--ink-5)}
  .show .name{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2}
  .show .note{font-size:14px;font-weight:700;color:var(--ink-3);line-height:1.5}
  .show.live .time,.show.live .name{color:var(--jade)}

  footer{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding-top:8px;
         border-top:1px solid var(--ink);font-size:11px;font-weight:700;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink-3)}

  @media (max-width:640px){
    body{padding:56px 20px 48px}
    h1 .t{width:46px;height:56px;font-size:31px}
    .player-row{flex-wrap:wrap;gap:18px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">
      <span class="dot"></span>
      <span>Radio independiente</span>
      <span class="rule"></span>
      <span id="clock">00:00</span>
    </div>

    <h1 aria-label="Canal Aztlán">
      <span class="row">
        <span class="t" style="background:#3E7D63;transform:rotate(-0.6deg)">C</span>
        <span class="t" style="background:#56926F;transform:rotate(0.5deg)">A</span>
        <span class="t" style="background:#2F6350;transform:rotate(-0.3deg)">N</span>
        <span class="t" style="background:#6BA487;transform:rotate(0.7deg)">A</span>
        <span class="t" style="background:#24513F;transform:rotate(-0.4deg)">L</span>
        <span aria-hidden="true" style="width:54px;height:82px;display:flex;align-items:flex-end;margin-left:-2px">
          <svg width="54" height="76" viewBox="0 0 54 76" fill="none" stroke="#2F6350" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 76 C10 58 4 48 12 38 C19 29 34 33 34 22"/>
            <path d="M34 22 C34 13 28 11 28 6 C28 2.5 31 1 34.5 1 C41 1 47 5 47 12 C47 19 41 24 34 22 Z" fill="#EDE8DC"/>
            <circle cx="38" cy="10" r="1.9" fill="#2F6350" stroke="none"/>
            <path d="M47 12 L53 10 M50 11 L52 14" stroke="#9C3B26" stroke-width="1.8"/>
          </svg>
        </span>
      </span>
      <span class="row">
        <span class="t" style="background:#2F6350;transform:rotate(0.6deg)">A</span>
        <span class="t" style="background:#6BA487;transform:rotate(-0.5deg)">Z</span>
        <span class="t" style="background:#3E7D63;transform:rotate(0.3deg)">T</span>
        <span class="t" style="background:#24513F;transform:rotate(-0.7deg)">L</span>
        <span class="t" style="background:#56926F;transform:rotate(0.4deg)">Á</span>
        <span class="t" style="background:#3E7D63;transform:rotate(-0.2deg)">N</span>
      </span>
    </h1>

    <p class="lead">Una voz que acompaña. Lectura de libros, cultura y palabra para quien quiera escuchar.</p>
  </header>

  <section class="player">
    <div class="hair-strong"></div>
    <div class="player-row">
      <button class="play" id="play" type="button" aria-label="Reproducir">
        <svg id="icon" width="16" height="18" viewBox="0 0 16 18" fill="currentColor"><path d="M1 0 L16 9 L1 18 Z"/></svg>
      </button>
      <div class="status">
        <div class="label" id="status">En pausa</div>
        <div class="title" id="now">Presiona play para escuchar</div>
      </div>
      <div class="vol">
        <span>Vol</span>
        <div class="rail" id="rail" role="slider" aria-label="Volumen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" tabindex="0">
          <div class="bg"></div>
          <div class="fill" id="fill" style="width:72%"></div>
          <div class="knob" id="knob" style="left:72%"></div>
        </div>
      </div>
    </div>
    <div class="hair"></div>
  </section>

  <section class="sched">
    <h2>Programación</h2>
    <div id="shows"></div>
  </section>

  <footer>
    <span>Desde México</span>
    <span style="font-variant-numeric:tabular-nums">96.3 FM · En línea</span>
  </footer>

</div>

<script>
// === CONFIGURACIÓN DEL STREAM ===
// El punto de montaje de tu servidor Icecast en Railway.
// "/stream" funciona porque la página se sirve desde el mismo servidor.
const STREAM_URL = "/stream";

const SHOWS = [
  { time:'10:00', title:'Café con letras',  note:'Poesía y relatos breves para empezar el día', start:600 },
  { time:'16:00', title:'Voces de México',  note:'Cultura, historia y conversación',            start:960 },
  { time:'21:40', title:'La hora del libro',note:'Lectura de un capítulo en voz alta',          start:1300 }
];

let playing = false;      // el usuario pulsó play
let onAir   = false;      // hay señal real entrando del stream
let volume  = 0.72;

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preload = "none";
audio.crossOrigin = "anonymous";
audio.volume = volume;

// ---------- Estática de radio (sintetizada, sin archivos) ----------
// Se genera ruido rosado + un silbido tenue que imita el "buscar estación".
let actx = null, noiseSrc = null, noiseGain = null, staticOn = false;

function buildStatic(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();

  // 2 segundos de ruido en bucle
  const secs = 2;
  const buffer = actx.createBuffer(1, actx.sampleRate * secs, actx.sampleRate);
  const data = buffer.getChannelData(0);
  // ruido rosado aproximado (más cálido que el blanco, como radio vieja)
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i=0;i<data.length;i++){
    const white = Math.random()*2-1;
    b0=0.99886*b0+white*0.0555179; b1=0.99332*b1+white*0.0750759;
    b2=0.96900*b2+white*0.1538520; b3=0.86650*b3+white*0.3104856;
    b4=0.55000*b4+white*0.5329522; b5=-0.7616*b5-white*0.0168980;
    data[i]=(b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11; b6=white*0.115926;
  }
  noiseSrc = actx.createBufferSource();
  noiseSrc.buffer = buffer;
  noiseSrc.loop = true;

  // filtro pasa-banda: le da ese timbre de bocina de radio
  const band = actx.createBiquadFilter();
  band.type = "bandpass"; band.frequency.value = 1600; band.Q.value = 0.7;

  noiseGain = actx.createGain();
  noiseGain.gain.value = 0;

  noiseSrc.connect(band); band.connect(noiseGain); noiseGain.connect(actx.destination);
  noiseSrc.start();

  // pequeño vaivén del volumen del ruido = sensación de sintonizar
  setInterval(()=>{
    if (!staticOn || !noiseGain) return;
    const base = 0.12 * volume;
    const wobble = base * (0.6 + Math.random()*0.5);
    noiseGain.gain.setTargetAtTime(wobble, actx.currentTime, 0.25);
  }, 400);
}
function staticStart(){
  buildStatic();
  if (actx.state === "suspended") actx.resume();
  staticOn = true;
  noiseGain.gain.setTargetAtTime(0.12*volume, actx.currentTime, 0.1);
}
function staticStop(){
  staticOn = false;
  if (noiseGain) noiseGain.gain.setTargetAtTime(0, actx.currentTime, 0.4);
}

// ---------- Control del reproductor ----------
function play(){
  playing = true;
  onAir = false;
  renderPlayer("Buscando señal…");
  staticStart();                          // suena la estática mientras conecta
  audio.src = STREAM_URL + "?_=" + Date.now();
  audio.play().catch(()=>{ /* si autoplay falla, el click ya lo permite */ });
}
function stop(){
  playing = false;
  onAir = false;
  staticStop();
  audio.pause();
  audio.src = "";
  renderPlayer();
}

// llega audio real del stream
audio.addEventListener("playing", ()=>{
  onAir = true;
  staticStop();                           // se calla la estática, entra la voz
  renderPlayer();
});
// no hay nadie transmitiendo o se cortó
audio.addEventListener("error", ()=>{
  if (playing){ onAir = false; renderPlayer(); }  // se queda la estática = "sin señal"
});
audio.addEventListener("stalled", ()=>{ if (playing){ onAir=false; renderPlayer(); staticStart(); }});
audio.addEventListener("waiting", ()=>{ if (playing){ onAir=false; renderPlayer(); staticStart(); }});

// ---------- Programación y estado ----------
function currentIndex(){
  const d = new Date(), m = d.getHours()*60 + d.getMinutes();
  if (m < SHOWS[0].start) return SHOWS.length - 1;
  let idx = 0;
  SHOWS.forEach((s,i) => { if (m >= s.start) idx = i; });
  return idx;
}
function renderShows(){
  const cur = currentIndex();
  $('shows').innerHTML = SHOWS.map((s,i) => `
    <div class="show${i===cur?' live':''}">
      <div class="time">${s.time}</div>
      <div><div class="name">${s.title}</div><div class="note">${s.note}</div></div>
    </div>`).join('');
}
function renderPlayer(customTitle){
  const cur = currentIndex();
  let label, title;
  if (!playing){ label = "En pausa"; title = "Presiona play para escuchar"; }
  else if (onAir){ label = "Al aire"; title = SHOWS[cur].title; }
  else { label = "Sin señal"; title = customTitle || "Sintonizando… no hay transmisión ahora"; }

  $('status').textContent = label;
  $('now').textContent = title;
  $('icon').innerHTML = playing
    ? '<rect x="1" y="0" width="4.5" height="18"/><rect x="10.5" y="0" width="4.5" height="18"/>'
    : '<path d="M1 0 L16 9 L1 18 Z"/>';
  $('play').setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
}
function renderVolume(){
  const pct = Math.round(volume*100) + '%';
  $('fill').style.width = pct; $('knob').style.left = pct;
  $('rail').setAttribute('aria-valuenow', Math.round(volume*100));
  audio.volume = volume;
}
function tick(){
  $('clock').textContent = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});
  renderShows(); if (!playing || onAir) renderPlayer();
}

$('play').addEventListener('click', ()=>{ playing ? stop() : play(); });
$('rail').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  volume = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  renderVolume();
});
$('rail').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') volume = Math.min(1, volume + .05);
  else if (e.key === 'ArrowLeft') volume = Math.max(0, volume - .05);
  else return;
  e.preventDefault(); renderVolume();
});

tick(); renderVolume();
setInterval(tick, 20000);
</script>
</body>
</html>
